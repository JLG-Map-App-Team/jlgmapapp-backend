# Stage C gate: install -> typecheck -> lint -> test -> build -> deploy.
# The deploy step publishes a versioned CI artifact; production deployment is
# deliberately deferred to Stage E, when the origin and hosting targets exist.

name: API contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch — a PR that gets three pushes in a
# minute should not burn three full runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile is out of step with package.json. `npm install` would silently
      # resolve new versions, which is how codegen output drifts between
      # machines for no visible reason.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint the OpenAPI spec
        run: npm run lint

      # Fails if openapi_B2.yaml was edited without regenerating the types.
      - name: Check generated types are in sync with the spec
        run: npm run gen:api:check

      - name: Start PostGIS and pgRouting
        run: POSTGRES_PORT=55432 docker compose -p jlgmapapp-c2 up -d --wait

      - name: Apply migrations
        run: POSTGRES_PORT=55432 npm run db:migrate

      - name: Seed the fixed route extract
        run: POSTGRES_PORT=55432 npm run seed

      - name: Run the real database test
        run: POSTGRES_PORT=55432 npm test

      - name: Run the accessibility gate
        run: npm run test:a11y

      - name: Build
        run: npm run build

      - name: Package deployment artifact
        run: tar -czf jlgmapapp-backend-${{ github.sha }}.tgz dist package.json package-lock.json

      - name: Deploy CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: jlgmapapp-backend-${{ github.sha }}
          path: jlgmapapp-backend-${{ github.sha }}.tgz
          if-no-files-found: error
          retention-days: 14