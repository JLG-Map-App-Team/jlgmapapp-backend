services:
  database:
    image: pgrouting/pgrouting:16-3.4-3.6.1
    environment:
      POSTGRES_DB: jlgmapapp
      POSTGRES_USER: jlgmapapp
      POSTGRES_PASSWORD: jlgmapapp_dev
    ports:
      - "5432:5432"
    volumes:
      - jlgmapapp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jlgmapapp -d jlgmapapp"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  jlgmapapp-postgres-data:
