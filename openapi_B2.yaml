openapi: 3.0.3
info:
  title: JLG Map App API
  version: "1.0"
servers:
  # Local development only. There is deliberately no production entry yet.
  #
  # The production hostname has not been decided (plan §5 Stage E, task E1).
  # A placeholder production URL is worse than no entry: client generators and
  # "try it" tooling would emit code pointing at a domain the project does not
  # own. Plan §5 task D5 already requires the API base URL to come from an
  # environment variable and never be hardcoded, so no consumer depends on
  # this list resolving a production host.
  #
  # Add the production entry at Stage E, once E1 has a real hostname and TLS.
  #
  # Versioning lives in the path (/api/v1/...), not in the server URL — per
  # plan §5 task B1, "version the path from the first commit". Do not add
  # /v1 to a server URL: combined with the path it yields /v1/api/v1/segments.
  - url: http://localhost:3000
    description: Local development
paths:
  /api/v1/segments:
    get:
      operationId: getSegments
      # Deliberately public — this is not an omission.
      # The walking skeleton scope (plan §2.1) lists "no admin authentication"
      # as an explicit non-goal, and Firebase Auth is scoped to admin write
      # surfaces only (ADR-001 §4.3, §4.11). No admin endpoint exists in this
      # spec yet. An empty array means "no security requirements" and overrides
      # any root-level `security` added later — OpenAPI 3.0.3, Operation Object.
      security: []
      summary: Route segments
      responses:
        "200":
          description: >
            GeoJSON FeatureCollection of route segment LineStrings.
            Coordinates are WGS 84 (EPSG:4326), longitude then latitude — RFC 7946 §4.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/SegmentFeatureCollection'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

components:
  schemas:

    # ---------------------------------------------------------------------
    # Geometry primitives — RFC 7946
    # ---------------------------------------------------------------------

    Position:
      type: array
      description: >
        A single coordinate pair — longitude then latitude, in that order,
        in decimal degrees (RFC 7946 §3.1.1). Elevation is deliberately
        excluded: core.route_segment.geom is geometry(LineString, 4326),
        two-dimensional, so a third element would mean the pipeline has
        introduced a Z value nothing downstream expects.
      items:
        type: number
      minItems: 2
      maxItems: 2

    LineStringGeometry:
      type: object
      description: >
        A GeoJSON LineString. Coordinates are always WGS 84 (EPSG:4326).
        The database also holds core.route_segment.geom_proj in EPSG:26917
        for distance work; that projected form must never be serialised
        through this schema — enforced by the ST_SRID contract test
        (plan §5 Stage D, task D2a).
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [LineString]
        coordinates:
          type: array
          items:
            $ref: '#/components/schemas/Position'

    # ---------------------------------------------------------------------
    # Route segment payload
    # ---------------------------------------------------------------------

    SegmentProperties:
      type: object
      description: >
        Non-geometric attributes of a route segment. Sourced from the City of
        Detroit Route Segments layer (ADR-001 §4.8).

        Codes and labels are deliberately separate fields. The code is the
        stable machine key — clients branch on it and use it to look up styling
        (core.segment_status.color, core.segment_type.line_pattern). The label
        is a display string owned by the vocabulary table and may be reworded or
        translated at any time; clients must never branch on it.
      required: [segment_id, phase, phase_label, type, type_label]
      properties:

        segment_id:
          type: string
          description: >
            core.route_segment.id, stringified. Decided 2026-08-19.

            The bigint identity column is used rather than the source layer's
            OBJECTID because ArcGIS OBJECTIDs are internal row identifiers that
            may change when a layer is republished. Stability across ETL reloads
            depends on the loader UPSERTing on the existing
            route_segment_source_ref_unique (source, source_ref) constraint from
            migration M07, NOT on truncate-and-reinsert. If the loader
            truncates, these identifiers change on every run and any client that
            stored one is broken.

        phase:
          type: string
          nullable: true
          enum: [open, under_construction, funded, unfunded, null]
          description: >
            Segment status (FR-05) — ADR-001 §4.8. Values are
            core.segment_status.code, seeded by migration M011.

            Nullable because core.route_segment.status_code is a nullable
            reference and scripts/etl/cityRouteSegments.js explicitly writes
            null when PHASE_DESCRIPTION is absent from the source row. A client
            must handle a segment with no known status.

        phase_label:
          type: string
          nullable: true
          description: >
            Human-readable form of `phase`, from core.segment_status.label.
            Display only. Deliberately has no enum: labels are editable, and
            constraining them here would make a wording change a breaking API
            change. Null exactly when `phase` is null.
          example: "Under construction"

        type:
          type: string
          nullable: true
          enum:
            [
              off_street_trail,
              bridge,
              adjacent,
              on_street_greenway,
              alley,
              shared_street,
              null,
            ]
          description: >
            Segment type (FR-06) — ADR-001 §4.8. Values are
            core.segment_type.code, seeded by migration M011.

            Nullable for the same reason as `phase`: core.route_segment.type_code
            is a nullable reference.

        type_label:
          type: string
          nullable: true
          description: >
            Human-readable form of `type`, from core.segment_type.label.
            Display only, no enum — see `phase_label`. Null exactly when
            `type` is null.
          example: "Off-street trail"

    SegmentFeature:
      type: object
      description: One route segment as a GeoJSON Feature.
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        geometry:
          $ref: '#/components/schemas/LineStringGeometry'
        properties:
          $ref: '#/components/schemas/SegmentProperties'

    SegmentFeatureCollection:
      type: object
      description: >
        The full response body of GET /api/v1/segments — every route segment
        of the Joe Louis Greenway as a GeoJSON FeatureCollection.
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/SegmentFeature'

    # ---------------------------------------------------------------------
    # Errors
    # ---------------------------------------------------------------------

    Problem:
      type: object
      description: >
        Error payload in the Problem Details format — RFC 9457 (which obsoletes
        RFC 7807). One shape for every error this API returns, so a client can
        write one error handler and not one per endpoint.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: "about:blank"
          description: >
            URI reference identifying the problem type. Stable — clients may
            branch on it. "about:blank" means "no type beyond the status code".
          example: "/problems/rate-limited"
        title:
          type: string
          description: >
            Short human-readable summary of the problem type. Does not change
            from occurrence to occurrence of the same type.
          example: "Too Many Requests"
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: >
            HTTP status code, duplicated in the body. Present so the payload is
            self-describing when logged or forwarded away from its response.
          example: 429
        detail:
          type: string
          description: >
            Human-readable explanation specific to this occurrence. Safe for
            display to an end user. Must never contain a stack trace, SQL, a
            database identifier, or an internal hostname — NFR-SEC-03.
          example: "Request quota exceeded. Retry after 60 seconds."
        instance:
          type: string
          format: uri-reference
          description: >
            URI reference identifying this specific occurrence. Correlates a
            user-reported error with a server log line.
          example: "/problems/rate-limited/01J8Z9K2QF"

  responses:
    RateLimited:
      description: >
        Too many requests from this client. See the open question in
        docs/walking_skeleton_plan.md — this shape holds only for rate limiting
        applied by this API. Rate limiting applied at the Cloudflare edge
        (ADR-001 4.7) never reaches Express and returns Cloudflare's own
        response body, not this one.
      headers:
        Retry-After:
          description: >
            Seconds to wait before retrying — RFC 9110 section 10.2.3.
          schema:
            type: integer
            minimum: 0
          example: 60
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalServerError:
      description: >
        Unhandled server-side fault. The response body carries no diagnostic
        detail; the correlating detail is in the server log, found via
        "instance".
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ServiceUnavailable:
      description: >
        A dependency this endpoint needs is unreachable — in practice, the
        PostGIS database. Distinct from 500 on purpose: 503 means "the API is up
        and its dependency is not", which is the exact condition the Stage F1
        degradation test induces (NFR-AVL-02). The base map keeps loading;
        this endpoint alone fails.
      headers:
        Retry-After:
          description: >
            Seconds to wait before retrying, when a recovery estimate exists.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
